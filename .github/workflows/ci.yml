name: CI

on:
  push:
    branches: [java]
  pull_request:
    branches: [java]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -f api/pom.xml clean verify
      - name: Smoke test the packaged app
        run: |
          java -jar api/api/target/purchasing-api.jar &
          for i in $(seq 1 30); do curl -sf http://localhost:5125/actuator/health && break; sleep 2; done
          curl -sf http://localhost:5125/api/products
          curl -sf http://localhost:5125/ | grep -q "Purchasing"
