name: CI

on:
  push:
    branches: [typescript]
  pull_request:
    branches: [typescript]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/api/package-lock.json
            app/package-lock.json
      - name: Install
        run: npm run install:all
      - name: Test with coverage
        run: |
          (cd api/api && npm run test:coverage)
          (cd app && npm run test:coverage)
      - name: Build
        run: npm run build
      - name: Smoke test the built app
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:5125/api/health && break; sleep 1; done
          curl -sf http://localhost:5125/api/products
          curl -sf http://localhost:5125/ | grep -q "Purchasing"
